[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vib-sqd"
version = "0.1.0"
description = "A Qiskit-native workflow for vibrational-state simulation with sample-based quantum diagonalization (SQD)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [
  {name = "Kunal Kumar"}
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "qiskit>=1.0",
  "qiskit-aer>=0.14",
  "qiskit-nature>=0.7",
  "qiskit-addon-sqd>=0.12.1"
]

[project.optional-dependencies]
hardware = [
  "qiskit-ibm-runtime>=0.24"
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "black>=24.0"
]

[project.urls]
Repository = "https://github.com/qiskit-community/vib-sqd"

[tool.hatch.build.targets.wheel]
packages = ["vib_sqd"]

[tool.pytest.ini_options]
markers = [
    "slow: end-to-end / simulation tests that are slower (deselect with -m 'not slow')",
]

[tool.ruff.lint]
# Essentials-only CI scope for this first cut: these are all either
# deliberate patterns (F401 in encoding/__init__.py's public re-exports)
# or minor style items (unused variables, blind excepts) in ported research
# code, not correctness bugs -- tracked as follow-up cleanup, not blocking.
ignore = [
    "BLE001",  # blind-except
    "F841",    # unused-variable
    "RUF059",  # unused-unpacked-variable
    "S110",    # try-except-pass
    "C408",    # unnecessary-collection-call
    "PLW1510", # subprocess-run-without-check
    "RUF015",  # unnecessary-iterable-allocation-for-first-element
    "SIM102",  # collapsible-if
    "ISC004",  # implicit-string-concatenation-in-collection-literal
    "F401",    # unused-import (deliberate in __init__.py re-exports)
    "B017",    # assert-raises-exception
    "B023",    # function-uses-loop-variable
    "SIM118",  # in-dict-keys
    "PIE810",  # multiple-starts-ends-with
    "C401",    # unnecessary-generator-set
]
